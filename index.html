<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minor Revisions</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      #app-world {
        position: fixed;
        inset: 0;
      }

      #app-world[hidden] {
        display: none;
      }

      #app-world canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #interaction-prompt {
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 0.4rem 0.8rem;
        background: rgb(20 24 28 / 80%);
        color: #f2efe6;
        font:
          1rem/1.4 system-ui,
          sans-serif;
        border-radius: 0.25rem;
      }

      #interaction-prompt[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="app" data-state="starting">
      <h1>Minor Revisions</h1>
      <p id="app-status">Starting up…</p>
      <p>Game systems are not yet available.</p>
    </main>
    <div id="app-world" hidden></div>
    <section id="app-error" hidden>
      <h2>The game could not start</h2>
      <p id="app-error-message"></p>
      <button id="app-error-reload" type="button">Reload</button>
    </section>
    <noscript>
      <p>JavaScript modules are required to run this local page.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
