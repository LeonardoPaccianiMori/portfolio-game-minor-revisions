<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minor Revisions</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      #app-world {
        position: fixed;
        inset: 0;
      }

      #app-world[hidden] {
        display: none;
      }

      #app-world canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #interaction-prompt {
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 0.4rem 0.8rem;
        background: rgb(20 24 28 / 80%);
        color: #f2efe6;
        font:
          1rem/1.4 system-ui,
          sans-serif;
        border-radius: 0.25rem;
      }

      #interaction-prompt[hidden] {
        display: none;
      }

      #desk-board {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        background: rgb(16 20 24 / 92%);
        color: #f2efe6;
        font:
          0.95rem/1.45 system-ui,
          sans-serif;
        padding: 1.25rem;
      }

      #desk-board[hidden] {
        display: none;
      }

      .board-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .board-header h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .board-feedback {
        color: #ffd9a0;
      }

      .board-card {
        border: 1px solid #a08b5f;
        padding: 0.75rem;
        margin: 0.75rem 0;
      }

      .board-columns {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }

      .board-column h3 {
        margin: 0.8rem 0 0.4rem;
        font-size: 1rem;
        color: #cfd8dc;
      }

      .board-list {
        margin: 0;
        padding-left: 1.1rem;
      }

      .board-actions,
      .board-answers,
      .board-choices {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0.35rem 0 0.6rem;
      }

      .board-button,
      .board-close {
        font: inherit;
        color: #101418;
        background: #e8e2d4;
        border: 0;
        border-radius: 0.2rem;
        padding: 0.35rem 0.55rem;
        cursor: pointer;
      }

      .board-button:hover,
      .board-close:hover {
        background: #fff8e6;
      }

      .board-button:focus-visible,
      .board-close:focus-visible {
        outline: 3px solid #ffb35c;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main id="app" data-state="starting">
      <h1>Minor Revisions</h1>
      <p id="app-status">Starting up…</p>
      <p>Game systems are not yet available.</p>
    </main>
    <div id="app-world" hidden></div>
    <section id="app-error" hidden>
      <h2>The game could not start</h2>
      <p id="app-error-message"></p>
      <button id="app-error-reload" type="button">Reload</button>
    </section>
    <noscript>
      <p>JavaScript modules are required to run this local page.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
